plugins {
    id 'java'
}

group = 'com.eldryn'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation "org.spigotmc:spigot-api:${findProperty('testApi') ?: '1.20.1-R0.1-SNAPSHOT'}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
    if (project.hasProperty('testJavaHome')) {
        executable = "${project.property('testJavaHome')}/bin/java${System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''}"
    }
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
tasks.named('compileTestJava', JavaCompile) {
    if (project.hasProperty('testJavaHome')) {
        options.fork = true
        options.forkOptions.executable = "${project.property('testJavaHome')}/bin/javac${System.getProperty('os.name').startsWith('Windows') ? '.exe' : ''}"
    }
}
javadoc { options.addStringOption('Xdoclint:none', '-quiet') }
tasks.register('apiJar', Jar) {
    dependsOn classes
    archiveClassifier = 'api'
    from(sourceSets.main.output) { include 'com/eldryn/webconnector/api/**' }
}
tasks.named('assemble') { dependsOn 'apiJar' }
sourceSets {
    example {
        java.srcDir 'examples/java/src/main/java'
        resources.srcDir 'examples/java/src/main/resources'
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}
tasks.register('exampleJar', Jar) {
    dependsOn exampleClasses
    archiveBaseName = 'WebConnectorExample'
    from sourceSets.example.output
}
tasks.named('check') { dependsOn 'exampleJar' }
tasks.register('docsZip', Zip) {
    archiveClassifier = 'docs'
    from('README.md', 'README.ru.md', 'CHANGELOG.md', 'SECURITY.md')
    into('docs') { from 'docs' }
    into('examples') { from('examples') { exclude '**/__pycache__/**', '**/*.pyc' } }
    into('scripts') { from 'scripts' }
    into('config') { from 'src/main/resources/config.yml' }
}
tasks.named('assemble') { dependsOn 'docsZip' }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
